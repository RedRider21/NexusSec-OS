# NexusSec - picom: compositor usato SOLO dalla famiglia tema "Cards" (stile
# macOS) per gli angoli arrotondati e un'ombra morbida. Lo avvia/ferma
# nxs_profiles.model (_manage_picom) al cambio famiglia/profilo. Col tema
# default (Core) picom NON gira: zero costo di RAM per chi non usa lo stile iOS.

# Angoli arrotondati (richiedono il backend GLX).
backend = "glx";
vsync = true;
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'pcmanfm' && window_type = 'desktop'"
];

# Ombra morbida stile macOS.
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.35;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

# --- Sfocatura "vetro smerigliato" (Aero/acrilico) --------------------------
# Serve allo stile finestre "aero" (Vetro reale): sfoca cio' che sta DIETRO le
# regioni traslucide delle finestre. Le finestre opache (alpha = 1) non mostrano
# nulla dietro, quindi NON sono toccate: attivarla e' sicuro anche con Cards.
# Usiamo il blur KERNEL gaussiano: e' quello supportato da OGNI backend/versione
# di picom (i backend "legacy" NON implementano dual_kawase e ignorerebbero il
# blur). Un gaussiano 11x11 da' proprio il "vetro" morbido stile Aero. Su VM con
# GL software (llvmpipe) puo' costare: e' comunque opt-in (solo stile "aero").
blur-method = "kernel";
blur-kern = "11x11gaussian";
blur-background = true;
blur-background-frame = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'pcmanfm' && window_type = 'desktop'"
];

# Nessuna trasparenza aggressiva forzata: la traslucenza la decide il CSS dello
# stile finestre (alpha nel background), cosi' resta tutto leggibile.
