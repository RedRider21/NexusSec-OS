# NexusSec - impostazioni GTK3.
#
# gtk-double-click-distance / -time: CAUSA A MONTE del "col doppio tap sul
# touchpad le icone del desktop non si aprono, col pulsante si". GTK riconosce
# il doppio clic solo se i due clic arrivano entro 400 ms E entro 5 PIXEL.
# Col pulsante fisico il puntatore non si sposta di un pixel, quindi funziona;
# col dito i due tocchi atterrano sempre un po' distanti e il secondo clic
# viene contato come nuovo clic singolo -> l'icona si seleziona ma non parte.
# In macchina virtuale e' peggio: la latenza dilata anche l'intervallo.
# Allarghiamo entrambe le soglie: 16 px e 800 ms restano naturali col mouse e
# rendono affidabile il tap.
[Settings]
gtk-theme-name=NexusSec-Core
gtk-icon-theme-name=NexusSec-Base
gtk-application-prefer-dark-theme=1
gtk-font-name=DejaVu Sans 10
gtk-double-click-time=800
gtk-double-click-distance=16
