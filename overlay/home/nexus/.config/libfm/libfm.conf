# NexusSec - configurazione libfm (motore di pcmanfm).
# quick_exec=1: esegue i launcher .desktop / eseguibili SENZA il dialogo
# "Eseguire / Eseguire nel terminale / Apri?" (che impediva l'avvio di
# Terminale/Browser dalle icone del desktop).
[config]
quick_exec=1
terminal=lxterminal -e %s
si_unit=0
single_click=0
confirm_del=1
confirm_trash=1

[ui]
big_icon_size=48
small_icon_size=22
thumbnail_local=1
thumbnail_max=2048
