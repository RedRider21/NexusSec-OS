# NexusSec OS - touchpad (libinput).
# Di default libinput tiene il TAP DISABILITATO: sul portatile il "tocco" non
# genera il click, quindi i pulsanti piccoli (es. la X di chiusura finestra)
# non rispondono col mousepad. Abilitiamo il tap-to-click + due dita = tasto
# destro, e disabilitiamo il touchpad mentre si digita (evita click accidentali).
Section "InputClass"
    Identifier "NexusSec touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "DisableWhileTyping" "true"
    Option "ClickMethod" "clickfinger"
EndSection
