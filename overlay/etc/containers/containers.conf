# NexusSec OS - configurazione Podman a livello di sistema.
# La live gira su OpenRC (NIENTE systemd, NIENTE journald): fissiamo qui i valori
# corretti in modo ESPLICITO, cosi' Podman non li deve auto-rilevare a ogni run
# (e non rischia scelte errate). Vale anche per il rootless dell'utente 'nexus'
# (la config utente ~/.config/containers/containers.conf puo' sovrascrivere).

[engine]
# Senza systemd il cgroup manager DEVE essere cgroupfs (il default 'systemd'
# fallirebbe: "systemd cgroup flag passed, but systemd support ... not available").
cgroup_manager = "cgroupfs"

# Senza journald i log eventi vanno su file (il default 'journald' darebbe errori).
events_logger = "file"

[containers]
# I container dei tool NON hanno bisogno di limiti di risorse via cgroup: sul
# rootless senza delega dei cgroup (tipico su OpenRC) questo evita gli avvisi
# "cgroup is not writable / resource limits disabled" e mantiene i run puliti.
cgroups = "disabled"
