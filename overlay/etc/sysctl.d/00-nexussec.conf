# NexusSec OS - parametri kernel.
# User namespace non privilegiati: servono a Podman rootless (tool container/
# kali) e a bubblewrap (sandbox dei tool apk/pip). Senza, l'unshare fallisce con
# "unshare user ns: No space left on device". nexussec.start li imposta anche a
# runtime (la live non sempre esegue il servizio sysctl all'avvio).
user.max_user_namespaces = 15000

# ping ICMP senza raw socket (tool di rete che fanno ping da utente).
net.ipv4.ping_group_range = 0 2147483647
