<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HORUS">
  <defs>
    <radialGradient id="pupil" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2230"/>
      <stop offset="100%" stop-color="#031018"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Occhio di Horus (Wedjat): sopracciglio, occhio a mandorla, la linea che
       scende dall'angolo interno e la spirale che parte dall'angolo esterno.
       La pupilla e' un piccolo globo con meridiani: l'occhio che vede il globo. -->
  <g fill="none" stroke="#00e5ff" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- sopracciglio / linea d'orizzonte-orbita -->
    <path d="M11 20 Q31 9 55 17"/>
    <!-- palpebra superiore -->
    <path d="M8 34 Q26 18 54 27"/>
    <!-- palpebra inferiore -->
    <path d="M8 34 Q28 44 46 37"/>
    <!-- linea che scende (angolo interno) -->
    <path d="M15 39 L12 52"/>
    <!-- spirale/curl (angolo esterno) -->
    <path d="M45 38 Q47 50 37 52 Q31 53 32 47"/>
  </g>

  <!-- pupilla = globo -->
  <g filter="url(#glow)">
    <circle cx="28" cy="32" r="8.4" fill="url(#pupil)" stroke="#00e5ff" stroke-width="2.2"/>
    <g fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.85">
      <line x1="19.8" y1="32" x2="36.2" y2="32"/>
      <ellipse cx="28" cy="32" rx="3.4" ry="8.2"/>
      <path d="M20.4 28 Q28 30.5 35.6 28"/>
      <path d="M20.4 36 Q28 33.5 35.6 36"/>
    </g>
  </g>
</svg>
