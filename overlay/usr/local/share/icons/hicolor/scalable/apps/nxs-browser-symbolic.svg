<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="#bebebe">
  <!-- NexusSec browser (globo + saetta), SYMBOLIC monocromo ad AREE PIENE (GTK
       ricolora il fill col colore del pannello/menu: segue skin e profilo).
       Niente stroke (non verrebbe ricolorato); contorni = "anelli" evenodd.
       NB: nessun commento PRIMA di <svg> o gdk-pixbuf non lo riconosce. -->
  <!-- anello del globo -->
  <path fill-rule="evenodd"
        d="M8,1.6 A6.4,6.4 0 1,0 8,14.4 A6.4,6.4 0 1,0 8,1.6 Z
           M8,2.7 A5.3,5.3 0 1,1 8,13.3 A5.3,5.3 0 1,1 8,2.7 Z"/>
  <!-- meridiano (ellisse ad anello) -->
  <path fill-rule="evenodd"
        d="M8,1.6 A2.8,6.4 0 1,0 8,14.4 A2.8,6.4 0 1,0 8,1.6 Z
           M8,2.7 A1.9,5.3 0 1,1 8,13.3 A1.9,5.3 0 1,1 8,2.7 Z"/>
  <!-- paralleli -->
  <rect x="1.8" y="7.55" width="12.4" height="0.9"/>
  <rect x="3.0" y="5.15" width="10.0" height="0.85"/>
  <rect x="3.0" y="9.9"  width="10.0" height="0.85"/>
  <!-- saetta -->
  <polygon points="8.9,2.6 4.9,8.7 7.5,8.7 7.1,13.4 11.2,7.0 8.4,7.0"/>
</svg>
