    M3 2.5 h10 a1 1 0 0 1 1 1 v5 a1 1 0 0 1 -1 1 h-3 v2 a1 1 0 0 1 -1 1 h-2 a1 1 0 0 1 -1 -1 v-2 h-3 a1 1 0 0 1 -1 -1 v-5 a1 1 0 0 1 1 -1 z
    M4 4 v4 h2 v3 h4 v-3 h2 v-4 z"/>
